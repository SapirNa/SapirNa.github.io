<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corgi's Games</title>
  <meta name="description" content="Android games by Corgi's Games: Starloop and Word Guess.">
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1c1f2a;
      --muted: #5b6172;
      --accent: #4b5fd6;
      --border: #e1e4ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141c;
        --card: #1c1f2b;
        --text: #eef0f6;
        --muted: #a4a9b8;
        --accent: #8b9bff;
        --border: #2c3040;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .lead { margin: 0 0 32px; color: var(--muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .card p { margin: 0 0 14px; color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; gap: 8px 20px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 32px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Corgi's Games</h1>
    <p class="lead">Casual games for Android.</p>

    <section class="card">
      <h2>Starloop</h2>
      <p>Draw loops around moving stars to capture them. Hundreds of levels across themed worlds.</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.sapir.starloop">Google Play</a>
        <a href="https://sapirna.github.io/starloop-privacy/">Privacy policy</a>
      </div>
    </section>

    <section class="card" lang="he" dir="rtl">
      <h2>ניחוש המילה</h2>
      <p>משחק ניחוש מילים בעברית ל-Android.</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.sapir.wordguess">Google Play</a>
        <a href="https://sapirna.github.io/word-guess-privacy/">מדיניות פרטיות</a>
      </div>
    </section>

    <footer>&copy; 2026 Corgi's Games</footer>
  </main>
</body>
</html>
